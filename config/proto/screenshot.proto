syntax = "proto3";

package screenshot;

option go_package = "./protos";

service ScreenshotService {
  rpc CaptureScreenshot(CaptureRequest) returns (CaptureResponse);
}

message CaptureRequest {
  string url = 1;
  int32 width = 2;
  int32 height = 3;
}

message CaptureResponse {
  bytes data = 1;
  optional string error = 2;
}
